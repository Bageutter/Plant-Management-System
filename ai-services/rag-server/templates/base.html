<!doctype html>
<html lang="en" data-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shared RAG server — Plant Management System{% endblock %}</title>

    <!-- Franken UI (Tailwind/UIkit-based component styles) -->
    <link rel="stylesheet" href="https://unpkg.com/franken-ui@2.0.0/dist/css/core.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/franken-ui@2.0.0/dist/css/utilities.min.css" />
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <!-- Alpine.js -->
    <script src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js" defer></script>

    <style>
        :root {
            --background: 60 33% 98%;
            --foreground: 150 15% 14%;
            --muted: 100 20% 93%;
            --muted-foreground: 140 10% 38%;
            --border: 100 18% 85%;
            --primary: 142 42% 30%;
            --primary-foreground: 60 30% 98%;
            --destructive: 14 62% 45%;
            --destructive-foreground: 40 33% 97%;
            --ring: 142 42% 30%;
            --uk-global-radius: 0.75rem;
            --uk-global-radius-s: 0.5rem;
        }
        body { background-color: hsl(var(--background)); color: hsl(var(--foreground)); font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
        h1, h2, h3 { font-family: 'Fraunces', ui-serif, Georgia, serif; }
        a { color: inherit; text-decoration: none; }
        a:hover, .hover\:text-primary:hover { color: hsl(var(--primary)); }
        .text-muted-foreground { color: hsl(var(--muted-foreground)); }
        .bg-muted { background-color: hsl(var(--muted)); }
        .border-border { border-color: hsl(var(--border)); }
        .text-primary { color: hsl(var(--primary)); }
        .text-destructive { color: hsl(var(--destructive)); }
        .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
        .conf-high { background-color: hsl(142 42% 30%); color: hsl(var(--primary-foreground)); }
        .conf-medium { background-color: hsl(38 80% 42%); color: #fff; }
        .conf-low { background-color: hsl(var(--muted)); color: hsl(var(--muted-foreground)); border: 1px solid hsl(var(--border)); }
        .conf-insufficient { background-color: hsl(var(--destructive)); color: hsl(var(--destructive-foreground)); }
        .citation + .citation { border-top: 1px solid hsl(var(--border)); }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body>
    {% from '_header.html' import header %}
    {{ header(brand_url="/", nav_links=[{"label": "Sources", "url": "/rag/sources"}, {"label": "healthz", "url": "/healthz"}]) }}

    <main class="uk-container mx-auto py-12">
        {% block content %}{% endblock %}
    </main>

    <script type="module" src="https://unpkg.com/franken-ui@2.0.0/dist/js/core.iife.js"></script>
</body>
</html>
