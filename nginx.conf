events {}

http {
    # A two-iteration Plan -> Act -> Observe -> Adapt request can make up to four
    # model calls. Each app-side Ollama call allows 120 seconds, and cold model
    # loads add overhead, so the proxy must outlive that bounded request window.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    upstream frontend {
        server frontend:5000;
    }

    upstream auth {
        server auth:5000;
    }

    upstream vgarden {
        server vgarden:5000;
    }

    upstream health {
        server health:5000;
    }

    upstream almanac {
        server almanac:5000;
    }

    server {
        listen 80;

        # Frontend (served at the root)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth
        location /auth/ {
            proxy_pass http://auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Tells the Flask app (via ProxyFix) that it is mounted under /auth,
            # so url_for()/redirects come back with the /auth prefix.
            proxy_set_header X-Forwarded-Prefix /auth;
        }

        # Virtual Garden
        location /vgarden/ {
            proxy_pass http://vgarden/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /vgarden;
        }

        # Plant Health
        location /health/ {
            proxy_pass http://health/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /health;
            # The assessment endpoint streams progress events; don't buffer them.
            proxy_buffering off;
        }

        # Almanac
        location /almanac/ {
            proxy_pass http://almanac/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /almanac;
        }
    }
}
