services:
  # Single entry point. Everything is reached through http://localhost:3000
  # and path-routed to the individual services (see shared/proxy/). The same
  # image is deployed to Azure, where its upstreams are set by environment.
  proxy:
    build: ./shared/proxy
    ports:
      - "3000:80"
    depends_on:
      - frontend
      - auth
      - vgarden
      - health
      - almanac

  frontend:
    build: ./shared/frontend
    expose:
      - "5000"
    volumes:
      - ./shared/frontend:/app
      - ./shared/templates:/app/shared_templates
    environment:
      # Browser-facing URLs of the sibling services, all via the proxy.
      - AUTH_URL=http://localhost:3000/auth
      - HEALTH_URL=http://localhost:3000/health/plant-health-records/
      - ALMANAC_URL=http://localhost:3000/almanac/

  auth:
    build: ./auth
    expose:
      - "5000"
    volumes:
      - ./auth:/app
      - ./shared/templates:/app/shared_templates
    environment:
      - SECRET_KEY=dev-secret-key-change-me
      - DATABASE_URL=sqlite:////app/instance/auth.db
      # Server-to-server (internal Docker network).
      - VGARDEN_URL=http://vgarden:5000
      # Browser-facing (via the proxy).
      - VGARDEN_PUBLIC_URL=http://localhost:3000/vgarden
      - HEALTH_PUBLIC_URL=http://localhost:3000/health/plant-health-records
      - ALMANAC_PUBLIC_URL=http://localhost:3000/almanac/
      # Must match vgarden's INTER_SERVICE_SECRET exactly.
      - INTER_SERVICE_SECRET=${INTER_SERVICE_SECRET:-dev-inter-service-secret-change-me}
    depends_on:
      - vgarden

  vgarden:
    build: ./vgarden
    expose:
      - "5000"
    volumes:
      - ./vgarden:/app
      - ./shared/templates:/app/shared_templates
      - ./shared/ai_loop.py:/app/ai_loop.py:ro
      - ./tools/ai-loop/logs:/app/ai_loop_logs
      - vgarden_data:/app/instance
    environment:
      - SECRET_KEY=dev-vgarden-secret-key-change-me
      - DATABASE_URL=sqlite:////app/instance/vgarden.db
      # Browser-facing (via the proxy).
      - AUTH_PUBLIC_URL=http://localhost:3000/auth
      - HEALTH_PUBLIC_URL=http://localhost:3000/health/plant-health-records/
      - ALMANAC_PUBLIC_URL=http://localhost:3000/almanac/
      # Must match auth's INTER_SERVICE_SECRET exactly.
      - INTER_SERVICE_SECRET=${INTER_SERVICE_SECRET:-dev-inter-service-secret-change-me}
      # "Ask about this garden" AI. AI-Mode is the HOST's Ollama, never a compose
      # service (Release 1/2 rule); reached through host.docker.internal like almanac.
      - OLLAMA_URL=${VGARDEN_OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=qwen3:4b-instruct
      - OLLAMA_AUTO_PULL=true
      # Plan -> Act -> Observe -> Adapt loop; see docs/agentic-ai-workflow.md.
      - OLLAMA_REVIEW_MODEL=llama3.1:8b
      - AI_LOOP_MAX_ITERATIONS=2
      - AI_LOOP_LOG_DIR=/app/ai_loop_logs
      # Release 1: shared local MCP + RAG servers. They run on the HOST, outside
      # compose (never as services here); the container reaches them through
      # host.docker.internal, the same approach already used for OLLAMA_URL on
      # almanac above. CI sets both flags to false.
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://host.docker.internal:5105/mcp}
      - RAG_ENABLED=${RAG_ENABLED:-true}
      - RAG_SERVER_URL=${RAG_SERVER_URL:-http://host.docker.internal:5106}
      # Release 2: shared local Multi-Agent Server, also on the HOST (never a
      # compose service). CI and the cloud baseline set the flag to false.
      - MULTI_AGENT_ENABLED=${MULTI_AGENT_ENABLED:-true}
      - MULTI_AGENT_URL=${MULTI_AGENT_URL:-http://host.docker.internal:8003}
    extra_hosts:
      # Needed on Linux engines (incl. WSL); harmless on Docker Desktop.
      - "host.docker.internal:host-gateway"

  almanac:
    build: ./almanac
    expose:
      - "5000"
    environment:
      - SECRET_KEY=dev-almanac-secret-key-change-me
      # Server-to-server (internal Docker network).
      - AUTH_URL=http://auth:5000
      # Browser-facing (via the proxy).
      - AUTH_PUBLIC_URL=http://localhost:3000/auth
      - HEALTH_PUBLIC_URL=http://localhost:3000/health/plant-health-records/
      - DATABASE_URL=sqlite:////app/instance/almanac.db
      - FLASK_DEBUG=1
      - OLLAMA_URL=${ALMANAC_OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=qwen3:4b-instruct
      - OLLAMA_AUTO_PULL=true
      # Release 1 shared servers run on the host, never in this feature container.
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://host.docker.internal:5105/mcp}
      - RAG_ENABLED=${RAG_ENABLED:-true}
      - RAG_SERVER_URL=${RAG_SERVER_URL:-http://host.docker.internal:5106}
      # Plan -> Act -> Observe -> Adapt loop; see docs/agentic-ai-workflow.md.
      - OLLAMA_REVIEW_MODEL=llama3.1:8b
      - AI_LOOP_MAX_ITERATIONS=2
      - AI_LOOP_LOG_DIR=/app/ai_loop_logs
      # Copy the public My Garden catalogue only when the Almanac database is empty.
      # Imported records become local data; app edits never write back to GitHub.
      - LOAD_MY_GARDEN_SEED=${LOAD_MY_GARDEN_SEED:-true}
      - MY_GARDEN_SEED_URL=${MY_GARDEN_SEED_URL:-https://raw.githubusercontent.com/0melette/my_garden/main/snapshots/almanac-catalogue.json}
    volumes:
      - ./almanac:/app
      - ./shared/templates:/app/shared_templates
      - ./shared/ai_loop.py:/app/ai_loop.py:ro
      - ./tools/ai-loop/logs:/app/ai_loop_logs
      - almanac_data:/app/instance
    depends_on:
      - auth
    extra_hosts:
      - "host.docker.internal:host-gateway"

  health:
    build: ./health
    expose:
      - "5000"
    volumes:
      - ./health:/app
      - ./shared/templates:/app/shared_templates
      - ./shared/ai_loop.py:/app/ai_loop.py:ro
      - ./tools/ai-loop/logs:/app/ai_loop_logs
    environment:
      - DATABASE_URL=sqlite:////app/instance/health.db
      # Browser-facing (via the proxy).
      - AUTH_PUBLIC_URL=http://localhost:3000/auth
      - HEALTH_PUBLIC_URL=http://localhost:3000/health/plant-health-records/
      - ALMANAC_PUBLIC_URL=http://localhost:3000/almanac/
      # AI-Mode is the HOST's Ollama, never a compose service (see vgarden above).
      - OLLAMA_URL=${HEALTH_OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=qwen2.5vl:3b
      - OLLAMA_AUTO_PULL=true
      - OLLAMA_KEEP_ALIVE=30m
      # Pull (if needed) and load the model in the background at startup, so the
      # first assessment does not pay the cold-load cost. See /healthz.
      - OLLAMA_PRELOAD=true
      # Perceive -> Reason -> Act -> Observe -> Repeat around every assessment
      # (health/agentic.py). The reviewer is an independent text model.
      - OLLAMA_REVIEW_MODEL=qwen3:4b-instruct
      - AI_LOOP_MAX_ITERATIONS=2
      - AI_LOOP_LOG_DIR=/app/ai_loop_logs
      # Release 1: shared local MCP + RAG servers. They run on the HOST, outside
      # compose (never as services here); the container reaches them through
      # host.docker.internal, like the local AI mode. CI sets both flags to false.
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://host.docker.internal:5105/mcp}
      - RAG_ENABLED=${RAG_ENABLED:-true}
      - RAG_SERVER_URL=${RAG_SERVER_URL:-http://host.docker.internal:5106}
    extra_hosts:
      # Needed on Linux engines (incl. WSL); harmless on Docker Desktop.
      - "host.docker.internal:host-gateway"

volumes:
  almanac_data:
  vgarden_data:
