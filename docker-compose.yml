services:
  frontend:
    build: ./shared/frontend
    ports:
      - "5000:5000"
    volumes:
      - ./shared/frontend:/app
    environment:
      - AUTH_URL=http://localhost:5001

  auth:
    build: ./auth
    ports:
      - "5001:5000"
    volumes:
      - ./auth:/app
    environment:
      - SECRET_KEY=dev-secret-key-change-me
      - DATABASE_URL=sqlite:////app/instance/auth.db
      - VGARDEN_URL=http://vgarden:5000
      - VGARDEN_PUBLIC_URL=http://localhost:5002
      - HEALTH_PUBLIC_URL=http://localhost:5003
    depends_on:
      - vgarden

  vgarden:
    build: ./vgarden
    ports:
      - "5002:5000"
    volumes:
      - ./vgarden:/app
    environment:
      - DATABASE_URL=sqlite:////app/instance/vgarden.db
      - AUTH_PUBLIC_URL=http://localhost:5001

  health:
    build: ./health
    ports:
      - "5003:5000"
    volumes:
      - ./health:/app
    environment:
      - DATABASE_URL=sqlite:////app/instance/health.db
      - AUTH_PUBLIC_URL=http://localhost:5001
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma3:4b
      - OLLAMA_AUTO_PULL=true
    depends_on:
      - ollama

  # Locally hosted AI used by the health monitoring service. The model is pulled on
  # first use and cached in the ollama-models volume.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
