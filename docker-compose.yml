services:
  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth
      - vgarden
      - health
      - almanac

  frontend:
    build: ./shared/frontend
    expose:
      - "5000"
    volumes:
      - ./shared/frontend:/app
      - ./shared/templates:/app/shared_templates
    environment:
      - AUTH_URL=http://auth:5000
      - HEALTH_URL=http://health:5000/plant-health-records/
      - ALMANAC_URL=http://almanac:5000/

  auth:
    build: ./auth
    expose:
      - "5000"
    volumes:
      - ./auth:/app
      - ./shared/templates:/app/shared_templates
    environment:
      - SECRET_KEY=dev-secret-key-change-me
      - DATABASE_URL=sqlite:////app/instance/auth.db
      - VGARDEN_URL=http://vgarden:5000
      - VGARDEN_PUBLIC_URL=http://localhost:8080/vgarden/
      - HEALTH_PUBLIC_URL=http://localhost:8080/health/plant-health-records/
      - ALMANAC_PUBLIC_URL=http://localhost:8080/almanac/
    depends_on:
      - vgarden

  vgarden:
    build: ./vgarden
    expose:
      - "5000"
    volumes:
      - ./vgarden:/app
      - ./shared/templates:/app/shared_templates
    environment:
      - DATABASE_URL=sqlite:////app/instance/vgarden.db
      - AUTH_PUBLIC_URL=http://localhost:8080/auth/
      - HEALTH_PUBLIC_URL=http://localhost:8080/health/plant-health-records/
      - ALMANAC_PUBLIC_URL=http://localhost:8080/almanac/

  almanac:
    build: ./almanac
    expose:
      - "5000"
    environment:
      - AUTH_URL=http://auth:5000
      - AUTH_PUBLIC_URL=http://localhost:8080/auth/
      - HEALTH_PUBLIC_URL=http://localhost:8080/health/plant-health-records/
      - DATABASE_URL=sqlite:////app/instance/almanac.db
      - FLASK_DEBUG=1
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:4b-instruct
    volumes:
      - ./almanac:/app
      - ./shared/templates:/app/shared_templates
      - almanac_data:/app/instance
    depends_on:
      - auth

  health:
    build: ./health
    expose:
      - "5000"
    volumes:
      - ./health:/app
      - ./shared/templates:/app/shared_templates
    environment:
      - DATABASE_URL=sqlite:////app/instance/health.db
      - AUTH_PUBLIC_URL=http://localhost:8080/auth/
      - HEALTH_PUBLIC_URL=http://localhost:8080/health/plant-health-records/
      - ALMANAC_PUBLIC_URL=http://localhost:8080/almanac/
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5vl:3b
      - OLLAMA_AUTO_PULL=true
      - OLLAMA_KEEP_ALIVE=30m
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    # No ports exposed to host
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=1

volumes:
  ollama-models:
  almanac_data: