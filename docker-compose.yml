services:
  # Single entry point. Everything is reached through http://localhost:3000
  # and path-routed to the individual services (see nginx.conf).
  proxy:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth
      - vgarden
      - health
      - almanac

  frontend:
    build: ./shared/frontend
    expose:
      - "5000"
    volumes:
      - ./shared/frontend:/app
      - ./shared/templates:/app/shared_templates
    environment:
      # Browser-facing URLs of the sibling services, all via the proxy.
      - AUTH_URL=http://localhost:3000/auth
      - HEALTH_URL=http://localhost:3000/health/plant-health-records/
      - ALMANAC_URL=http://localhost:3000/almanac/

  auth:
    build: ./auth
    expose:
      - "5000"
    volumes:
      - ./auth:/app
      - ./shared/templates:/app/shared_templates
    environment:
      - SECRET_KEY=dev-secret-key-change-me
      - DATABASE_URL=sqlite:////app/instance/auth.db
      # Server-to-server (internal Docker network).
      - VGARDEN_URL=http://vgarden:5000
      # Browser-facing (via the proxy).
      - VGARDEN_PUBLIC_URL=http://localhost:3000/vgarden
      - HEALTH_PUBLIC_URL=http://localhost:3000/health/plant-health-records
      - ALMANAC_PUBLIC_URL=http://localhost:3000/almanac/
      # Must match vgarden's INTER_SERVICE_SECRET exactly.
      - INTER_SERVICE_SECRET=${INTER_SERVICE_SECRET:-dev-inter-service-secret-change-me}
    depends_on:
      - vgarden

  vgarden:
    build: ./vgarden
    expose:
      - "5000"
    volumes:
      - ./vgarden:/app
      - ./shared/templates:/app/shared_templates
      - vgarden_data:/app/instance
    environment:
      - SECRET_KEY=dev-vgarden-secret-key-change-me
      - DATABASE_URL=sqlite:////app/instance/vgarden.db
      # Browser-facing (via the proxy).
      - AUTH_PUBLIC_URL=http://localhost:3000/auth
      - HEALTH_PUBLIC_URL=http://localhost:3000/health/plant-health-records/
      - ALMANAC_PUBLIC_URL=http://localhost:3000/almanac/
      # Must match auth's INTER_SERVICE_SECRET exactly.
      - INTER_SERVICE_SECRET=${INTER_SERVICE_SECRET:-dev-inter-service-secret-change-me}
      # Locally hosted AI for the "ask about this garden" assistant (mirrors almanac).
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:4b-instruct
    extra_hosts:
      - "host.docker.internal:host-gateway"

  almanac:
    build: ./almanac
    expose:
      - "5000"
    environment:
      # Server-to-server (internal Docker network).
      - AUTH_URL=http://auth:5000
      # Browser-facing (via the proxy).
      - AUTH_PUBLIC_URL=http://localhost:3000/auth
      - HEALTH_PUBLIC_URL=http://localhost:3000/health/plant-health-records/
      - DATABASE_URL=sqlite:////app/instance/almanac.db
      - FLASK_DEBUG=1
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:4b-instruct
    volumes:
      - ./almanac:/app
      - ./shared/templates:/app/shared_templates
      - almanac_data:/app/instance
    depends_on:
      - auth

  health:
    build: ./health
    expose:
      - "5000"
    volumes:
      - ./health:/app
      - ./shared/templates:/app/shared_templates
    environment:
      - DATABASE_URL=sqlite:////app/instance/health.db
      # Browser-facing (via the proxy).
      - AUTH_PUBLIC_URL=http://localhost:3000/auth
      - HEALTH_PUBLIC_URL=http://localhost:3000/health/plant-health-records/
      - ALMANAC_PUBLIC_URL=http://localhost:3000/almanac/
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5vl:3b
      - OLLAMA_AUTO_PULL=true
      - OLLAMA_KEEP_ALIVE=30m
    depends_on:
      - ollama

  # Locally hosted AI used by the health monitoring service. The model is pulled on
  # first use and cached in the ollama-models volume. Reached only from inside the
  # compose network (almanac and vgarden use the host's own Ollama via
  # host.docker.internal instead).
  # Runs on CPU by default; add docker-compose.gpu.yml for NVIDIA GPU acceleration.
  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Keep one model resident so repeat requests skip the load cost.
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=1

volumes:
  ollama-models:
  almanac_data:
  vgarden_data:
