name: AI services (shared MCP + RAG)

# The shared MCP and RAG servers are local, non-containerised processes (Release 1
# rule), so CI only lints and unit-tests them. No Ollama, no feature service and no
# model download is needed: the tests use in-memory clients and fakes.
on:
  push:
    branches: [main]
    paths:
      - "ai-services/**"
      - "pyproject.toml"
      - ".github/workflows/ai-services.yml"
  pull_request:
    paths:
      - "ai-services/**"
      - "pyproject.toml"
      - ".github/workflows/ai-services.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.4"
          args: check --output-format=github ai-services
      - name: Compile-check Python files
        run: python -m compileall -q ai-services

  mcp-server:
    name: MCP server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-services/mcp-server/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r ai-services/mcp-server/requirements-dev.txt
      - name: Run tests
        working-directory: ai-services/mcp-server
        env:
          MCP_ENABLED: "false" # CI never talks to a feature service
        run: python -m pytest -q
