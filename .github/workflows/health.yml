name: Plant Health (Guhan)

# Plant Health feature CI (Release 2): lint, post-commit tests of the two assigned
# endpoint functions (routes.create_assessment, routes.list_assessments) with retained
# evidence, the remaining regression suite, image build, and a compose smoke test of
# the containerised service through the proxy. The MCP and RAG integration stays in
# the code but both modes are DISABLED here (MCP_ENABLED=false, RAG_ENABLED=false) —
# the shared servers are local, non-containerised processes that never run in CI.
on:
  push:
    branches: [main, "bageutter/**", "claude/**"]
    paths:
      - "health/**"
      - "ai-services/mcp-server/**"
      - "shared/templates/**"
      - "scripts/test/smoke-health.sh"
      - "docker-compose.yml"
      - "shared/proxy/**"
      - "pyproject.toml"
      - ".github/workflows/health.yml"
  pull_request:
    paths:
      - "health/**"
      - "ai-services/mcp-server/**"
      - "shared/templates/**"
      - "scripts/test/smoke-health.sh"
      - "docker-compose.yml"
      - "shared/proxy/**"
      - "pyproject.toml"
      - ".github/workflows/health.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

env:
  # Release 1 rule: integration retained, both modes off during CI/CD. The Release 2
  # Multi-Agent Server is a host process too, so it is off here as well.
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  MULTI_AGENT_ENABLED: "false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.4"
          args: check --output-format=github health ai-services/mcp-server
      - name: Compile-check Python files
        run: python -m compileall -q health ai-services/mcp-server

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            health/requirements.txt
            health/requirements-dev.txt
      - name: Install dependencies
        id: install
        run: pip install -r health/requirements-dev.txt

      - name: Prepare test evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/health-results"
          python - <<'PYTHON'
          import json, os, platform, subprocess
          from pathlib import Path
          evidence = {
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "owner": "Guhan Sundar",
              "service": "health",
              "workflow_file": ".github/workflows/health.yml",
              "event": os.environ["GITHUB_EVENT_NAME"],
              "source_sha": os.environ["SOURCE_SHA"],
              "tested_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "python": platform.python_version(),
              "endpoint_functions": {
                  "routes.create_assessment": "POST /plant-health-records/assessments",
                  "routes.list_assessments": "GET /plant-health-records/assessments",
              },
          }
          Path(os.environ["RUNNER_TEMP"], "health-results", "run.json").write_text(json.dumps(evidence, indent=2))
          PYTHON

      - name: Test the two assigned endpoint functions
        working-directory: health
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v tests/test_endpoints.py \
            --junitxml="$RUNNER_TEMP/health-results/endpoints.xml" \
            2>&1 | tee "$RUNNER_TEMP/health-results/endpoints.log"

      - name: Run remaining Plant Health regression tests (fake model; in-process shared MCP server)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: health
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --ignore=tests/test_endpoints.py \
            --junitxml="$RUNNER_TEMP/health-results/regressions.xml" \
            2>&1 | tee "$RUNNER_TEMP/health-results/regressions.log"

      - name: Save endpoint and regression test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: health-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/health-results/
          if-no-files-found: warn
          retention-days: 30

  docker-build:
    name: Docker image builds
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag health:ci ./health

  compose-smoke:
    name: Compose smoke test (MCP + RAG disabled)
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: plant-management-health-ci
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Start the stack
        run: docker compose up --detach --build
      - name: Smoke-check the health service through the proxy
        run: bash scripts/test/smoke-health.sh http://127.0.0.1:3000
      - name: Save logs
        if: always()
        run: docker compose logs --no-color health proxy > health-compose.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: health-compose-logs-${{ github.run_id }}
          path: health-compose.log
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
