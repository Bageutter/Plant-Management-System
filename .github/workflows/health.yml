name: Health

# Plant Health feature CI (Release 1): lint, unit/e2e tests, image build, and a
# compose smoke test of the containerised service through the proxy. The MCP and
# RAG integration stays in the code but both modes are DISABLED here
# (MCP_ENABLED=false, RAG_ENABLED=false) — the shared servers are local,
# non-containerised processes that never run in CI.
on:
  push:
    branches: [main, "bageutter/**"]
    paths:
      - "health/**"
      - "ai-services/mcp-server/**"
      - "shared/templates/**"
      - "scripts/test/smoke-health.sh"
      - "docker-compose.yml"
      - "nginx.conf"
      - "pyproject.toml"
      - ".github/workflows/health.yml"
  pull_request:
    paths:
      - "health/**"
      - "ai-services/mcp-server/**"
      - "shared/templates/**"
      - "scripts/test/smoke-health.sh"
      - "docker-compose.yml"
      - "nginx.conf"
      - "pyproject.toml"
      - ".github/workflows/health.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

env:
  # Release 1 rule: integration retained, both modes off during CI/CD.
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.4"
          args: check --output-format=github health ai-services/mcp-server
      - name: Compile-check Python files
        run: python -m compileall -q health ai-services/mcp-server

  test:
    name: Unit + e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: health/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r health/requirements-dev.txt
      - name: Run tests (fake model; in-process shared MCP server)
        working-directory: health
        run: python -m pytest -q

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag health:ci ./health

  compose-smoke:
    name: Compose smoke test (MCP + RAG disabled)
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: plant-management-health-ci
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Start the stack
        run: docker compose up --detach --build
      - name: Smoke-check the health service through the proxy
        run: bash scripts/test/smoke-health.sh http://127.0.0.1:3000
      - name: Save logs
        if: always()
        run: docker compose logs --no-color health proxy > health-compose.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: health-compose-logs-${{ github.run_id }}
          path: health-compose.log
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
