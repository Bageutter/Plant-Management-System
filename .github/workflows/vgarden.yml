name: Virtual Garden (Yunus)

# Virtual Garden feature CI (Release 2): lint, post-commit tests of the two assigned
# endpoint functions (routes.create_garden, routes.garden_snapshot) with retained
# evidence, the remaining regression suite, image build, and a compose smoke test
# through the proxy. The MCP and RAG integration stays in the code but both modes
# are DISABLED here (MCP_ENABLED=false, RAG_ENABLED=false) — the shared servers are
# local, non-containerised processes that never run in CI.
on:
  push:
    branches: ["main", "yunz/**"]
    paths:
      - "vgarden/**"
      - "shared/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "scripts/test/smoke-vgarden.sh"
      - "tools/ai-loop/**"
      - "docker-compose.yml"
      - "nginx.conf"
      - "pyproject.toml"
      - ".github/workflows/vgarden.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "vgarden/**"
      - "shared/**"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "scripts/test/smoke-vgarden.sh"
      - "tools/ai-loop/**"
      - "docker-compose.yml"
      - "nginx.conf"
      - "pyproject.toml"
      - ".github/workflows/vgarden.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vgarden-${{ github.ref }}
  cancel-in-progress: true

env:
  # Release 1 rule: integration retained, both modes off during CI/CD.
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  MULTI_AGENT_ENABLED: "false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.4"
          args: check --output-format=github vgarden

      - name: Compile-check Python files
        run: python -m compileall -q vgarden

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            vgarden/requirements.txt
            vgarden/requirements-dev.txt

      - name: Install dependencies
        id: install
        run: pip install -r vgarden/requirements-dev.txt

      - name: Prepare test evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/vgarden-results"
          python - <<'PYTHON'
          import json, os, platform, subprocess
          from pathlib import Path
          evidence = {
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "owner": "Yunus Sayed",
              "service": "vgarden",
              "workflow_file": ".github/workflows/vgarden.yml",
              "event": os.environ["GITHUB_EVENT_NAME"],
              "source_sha": os.environ["SOURCE_SHA"],
              "tested_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "python": platform.python_version(),
              "endpoint_functions": {
                  "routes.create_garden": "POST /gardens",
                  "routes.garden_snapshot": "GET /gardens/<id>/snapshot",
              },
          }
          Path(os.environ["RUNNER_TEMP"], "vgarden-results", "run.json").write_text(json.dumps(evidence, indent=2))
          PYTHON

      - name: Test the two assigned endpoint functions
        working-directory: vgarden
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v tests/test_endpoints.py \
            --junitxml="$RUNNER_TEMP/vgarden-results/endpoints.xml" \
            2>&1 | tee "$RUNNER_TEMP/vgarden-results/endpoints.log"

      - name: Run remaining Virtual Garden regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: vgarden
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --ignore=tests/test_endpoints.py \
            --junitxml="$RUNNER_TEMP/vgarden-results/regressions.xml" \
            2>&1 | tee "$RUNNER_TEMP/vgarden-results/regressions.log"

      - name: Test the agentic-loop review modes (fake model, no Ollama)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tools/ai-loop/tests -v \
            2>&1 | tee "$RUNNER_TEMP/vgarden-results/ai-loop-review-modes.log"

      - name: Save endpoint and regression test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vgarden-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vgarden-results/
          if-no-files-found: warn
          retention-days: 30

  docker-build:
    needs: [lint, test]
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag vgarden:ci ./vgarden

  compose-smoke:
    name: Compose smoke test (MCP + RAG + Multi-Agent disabled)
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: plant-management-vgarden-ci
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Start the stack
        run: docker compose up --detach --build
      - name: Smoke-check the Virtual Garden service through the proxy
        run: bash scripts/test/smoke-vgarden.sh http://127.0.0.1:3000
      - name: Save logs
        if: always()
        run: docker compose logs --no-color vgarden proxy > vgarden-compose.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vgarden-compose-logs-${{ github.run_id }}
          path: vgarden-compose.log
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
