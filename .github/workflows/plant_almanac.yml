name: Plant Almanac (Amy)

on:
  push:
    branches: ["main", "amy/**"]
    paths:
      - "almanac/**"
      - "shared/**"
      - "tools/ai-loop/**"
      - "pyproject.toml"
      - ".github/workflows/plant_almanac.yml"
  pull_request:
    paths:
      - "almanac/**"
      - "shared/**"
      - "tools/ai-loop/**"
      - "pyproject.toml"
      - ".github/workflows/plant_almanac.yml"
  workflow_dispatch:

env:
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"

permissions:
  contents: read

concurrency:
  group: plant-almanac-amy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.4"
          args: check --output-format=github almanac shared/ai_loop.py tools/ai-loop/validate.py

      - name: Compile-check Python files
        run: python -m compileall -q almanac shared tools/ai-loop

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            almanac/requirements.txt
            almanac/requirements-dev.txt

      - name: Install Almanac dependencies
        id: install
        run: python -m pip install -r almanac/requirements-dev.txt

      - name: Prepare test evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/almanac-results"
          python - <<'PYTHON'
          import json, os, platform, subprocess
          from pathlib import Path
          evidence = {
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "owner": "Amy Zhou",
              "service": "almanac",
              "workflow_file": ".github/workflows/plant_almanac.yml",
              "event": os.environ["GITHUB_EVENT_NAME"],
              "source_sha": os.environ["SOURCE_SHA"],
              "tested_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "python": platform.python_version(),
              "endpoint_functions": {
                  "catalogue_api.search": "GET /api/catalogue",
                  "catalogue_api.plant": "GET /api/catalogue/plant/<slug>",
              },
          }
          Path(os.environ["RUNNER_TEMP"], "almanac-results", "run.json").write_text(json.dumps(evidence, indent=2))
          PYTHON

      - name: Test the two assigned endpoint functions
        working-directory: almanac
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v \
            tests/test_catalogue_api.py::test_public_catalogue_search_pages_and_literal_search \
            tests/test_catalogue_api.py::test_public_details_preserve_evidence_and_make_no_writes \
            --junitxml="$RUNNER_TEMP/almanac-results/endpoints.xml" \
            2>&1 | tee "$RUNNER_TEMP/almanac-results/endpoints.log"

      - name: Run remaining Almanac regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: almanac
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            -k 'not test_public_catalogue_search_pages_and_literal_search and not test_public_details_preserve_evidence_and_make_no_writes' \
            --junitxml="$RUNNER_TEMP/almanac-results/regressions.xml" \
            2>&1 | tee "$RUNNER_TEMP/almanac-results/regressions.log"

      - name: Save endpoint and regression test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: almanac-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/almanac-results/
          if-no-files-found: warn
          retention-days: 30

  docker-build:
    needs: [lint, test]
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@v7

      - name: Build the Almanac image
        run: docker build --tag plant-almanac:ci ./almanac
