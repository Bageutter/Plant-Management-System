name: Ruff

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.4"
          args: check --output-format=github

      - name: Compile-check Python files
        run: python -m compileall -q auth shared vgarden almanac
