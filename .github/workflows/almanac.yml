name: Plant Almanac (yunz)

# Runs the almanac test suite on the yunz/* branches (the shared placeholder
# workflow plant_almanac.yml still covers amy/*).
on:
  push:
    branches: ["yunz/**"]
    paths:
      - "almanac/**"
      - "shared/**"
      - "pyproject.toml"
      - ".github/workflows/almanac.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "almanac/**"
      - "shared/**"
      - "pyproject.toml"
      - ".github/workflows/almanac.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almanac-yunz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.4"
          args: check --output-format=github almanac shared/ai_loop.py
      - name: Compile-check Python files
        run: python -m compileall -q almanac shared

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: almanac/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r almanac/requirements-dev.txt
      - name: Run tests
        working-directory: almanac
        run: python -m pytest -q

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag almanac:ci ./almanac
