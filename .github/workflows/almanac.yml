name: Almanac validation

# Validate PRs and the merged main branch; retain yunz branch checks.
# plant_almanac.yml separately covers Amy's feature branch pushes.
on:
  push:
    branches: ["main", "yunz/**"]
    paths:
      - "almanac/**"
      - "shared/**"
      - "tools/ai-dev/**"
      - "pyproject.toml"
      - ".github/workflows/almanac.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "almanac/**"
      - "shared/**"
      - "tools/ai-dev/**"
      - "pyproject.toml"
      - ".github/workflows/almanac.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almanac-yunz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.4"
          args: check --output-format=github almanac shared/ai_loop.py tools/ai-dev/pipeline.py tools/ai-dev/tests
      - name: Compile-check Python files
        run: python -m compileall -q almanac shared

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: almanac/requirements*.txt
      - name: Install dependencies
        run: pip install -r almanac/requirements-dev.txt
      - name: Run tests
        working-directory: almanac
        env:
          MCP_EVIDENCE_DIR: ${{ runner.temp }}/mcp-evidence
        run: python -m pytest -q
      - name: Check the development pipeline dispatcher
        run: python -m pytest -q tools/ai-dev/tests
      - name: Preserve real MCP execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: almanac-mcp-evidence
          path: ${{ runner.temp }}/mcp-evidence
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag almanac:ci ./almanac
