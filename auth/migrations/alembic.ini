# Alembic configuration for this service's migrations (Flask-Migrate sets
# script_location to this directory at runtime). Logging is not configured
# here on purpose; the application's own logging applies.

[alembic]
# Revision files are named <rev>_<slug>.py, e.g. 0002_add_notes.py
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
