{% extends "base.html" %}

{% block title %}Plant Almanac{% endblock %}

{% block content %}
<h1>Plant Almanac</h1>

<ul>
    {% for plant in plants %}
    <li><a href="{{ url_for('plant_detail', slug=plant.slug) }}">{{ plant.common_name }}</a> — {{ plant.scientific_name }}</li>
    {% else %}
    <li>No plants yet.</li>
    {% endfor %}
</ul>
{% endblock %}
