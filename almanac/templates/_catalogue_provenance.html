<aside aria-label="Catalogue source" class="henny-sources"><details><summary>Sources & notes</summary><p>Plant information from My Garden.</p>{% if plant.source_url %}<p><a href="{{ plant.source_url }}" target="_blank" rel="noopener noreferrer">View plant reference ↗</a></p>{% endif %}{% if plant.not_applicable_fields %}<ul>{% for field, reason in plant.not_applicable_fields.items() %}<li><strong>{{ field|replace('_',' ') }}</strong>: {{ reason }}</li>{% endfor %}</ul>{% endif %}</details></aside>
