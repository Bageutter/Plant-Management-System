{% macro silhouette(x,y) %}<g transform="translate({{ x }},{{ y }})" fill="#6d9453">{% if plant.forest_layer in ['canopy','subcanopy'] %}<path d="M-3 0h6v-16h-6Z" fill="#92704a"/><circle cy="-22" r="11"/><circle cx="-8" cy="-16" r="8"/><circle cx="8" cy="-16" r="8"/>{% elif plant.forest_layer == 'vine' %}<path d="M0 0v-30m-12 18h24m-12-15v27" stroke="#8a7958" stroke-width="2" fill="none"/><ellipse cx="-6" cy="-10" rx="7" ry="4" transform="rotate(25)"/><ellipse cx="7" cy="-23" rx="7" ry="4" transform="rotate(-20)"/>{% else %}<path d="M0 0v-23" stroke="#507a36" stroke-width="3"/><ellipse cx="-7" cy="-16" rx="9" ry="5" transform="rotate(20)"/><ellipse cx="7" cy="-23" rx="9" ry="5" transform="rotate(-20)"/>{% endif %}</g>{% endmacro %}
{% if plant.in_row_spacing_cm is not none or plant.row_spacing_cm is not none %}
<figure class="spacing-visual"><figcaption>Give each plant room to grow</figcaption>
<svg viewBox="0 0 400 195" role="img" aria-label="{{ plant.common_name }} spacing: {{ plant.in_row_spacing_cm if plant.in_row_spacing_cm is not none else 'unrecorded' }} centimetres between plants, {{ plant.row_spacing_cm if plant.row_spacing_cm is not none else 'unrecorded' }} centimetres between rows. Diagram not to scale.">
<defs><marker id="spacing-arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#63824d" stroke-width="1.2"/></marker></defs>
<path d="M32 80H282M32 155H282" stroke="#c3d2ad" stroke-width="2" stroke-dasharray="3 5"/>
{{ silhouette(65,80) }}{{ silhouette(155,80) }}{{ silhouette(245,80) }}{{ silhouette(65,155) }}{{ silhouette(155,155) }}{{ silhouette(245,155) }}
<path d="M70 28H150" stroke="#63824d" marker-start="url(#spacing-arrow)" marker-end="url(#spacing-arrow)"/><text x="110" y="16" text-anchor="middle">{% if plant.in_row_spacing_cm is not none %}{{ '%g'|format(plant.in_row_spacing_cm / 100) }} m{% else %}Not recorded{% endif %}</text>
<path d="M301 85V150" stroke="#63824d" marker-start="url(#spacing-arrow)" marker-end="url(#spacing-arrow)"/><text x="315" y="117">{% if plant.row_spacing_cm is not none %}{{ '%g'|format(plant.row_spacing_cm / 100) }} m{% else %}Not recorded{% endif %}</text>
<text x="65" y="185">Between plants</text><text x="260" y="185">Between rows</text></svg>
<p>Between plants: <strong>{{ '%g'|format(plant.in_row_spacing_cm) ~ ' cm' if plant.in_row_spacing_cm is not none else 'Not recorded' }}</strong> · Between rows: <strong>{{ '%g'|format(plant.row_spacing_cm) ~ ' cm' if plant.row_spacing_cm is not none else 'Not recorded' }}</strong></p><small>Layout guide · not to scale</small></figure>
{% endif %}
